<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orbital Horizon - Lightweight Space Station VR</title>
  <meta name="description" content="A lightweight, fast-loading WebXR orbital space station demonstration for Meta Quest 3 and desktop browsers.">

  <!-- A-Frame CDN (Lightweight WebXR Framework) -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #00e5ff;
      --primary-glow: rgba(0, 229, 255, 0.4);
      --bg-glass: rgba(10, 16, 28, 0.78);
      --border-glass: rgba(0, 229, 255, 0.25);
      --text-main: #f0f6fc;
      --text-muted: #8b9bb4;
      --accent-green: #00ff88;
      --accent-warn: #ffaa00;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #000;
      color: var(--text-main);
    }

    /* 2D Desktop Overlay UI */
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 32px;
      transition: opacity 0.5s ease;
    }

    /* Top Navigation Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px var(--primary-glow);
      background: radial-gradient(circle, rgba(0, 229, 255, 0.2) 0%, rgba(0,0,0,0.8) 100%);
    }

    .brand-logo svg {
      width: 20px;
      height: 20px;
      fill: var(--primary);
    }

    .brand-text h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #fff;
      text-transform: uppercase;
      text-shadow: 0 0 10px var(--primary-glow);
    }

    .brand-text p {
      font-size: 11px;
      color: var(--primary);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-glass);
      border: 1px solid var(--border-glass);
      padding: 8px 16px;
      border-radius: 20px;
      backdrop-filter: blur(8px);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green);
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    /* Center Message / Info Card (Desktop) */
    .info-toast {
      position: absolute;
      top: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-glass);
      border: 1px solid var(--border-glass);
      padding: 12px 24px;
      border-radius: 12px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      text-align: center;
      pointer-events: auto;
      max-width: 440px;
      transition: all 0.3s ease;
    }

    .info-toast h3 {
      font-size: 14px;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 4px;
    }

    .info-toast p {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* Bottom Control Bar */
    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: auto;
    }

    .controls-guide {
      background: var(--bg-glass);
      border: 1px solid var(--border-glass);
      padding: 14px 20px;
      border-radius: 14px;
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .controls-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .keys-row {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 13px;
    }

    .key-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .key-badge {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 2px 8px;
      border-radius: 6px;
      font-family: monospace;
      font-weight: 700;
      color: #fff;
      font-size: 11px;
    }

    /* Quick Action Buttons */
    .action-panel {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn {
      padding: 12px 24px;
      border-radius: 12px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.25s ease;
      border: none;
      outline: none;
    }

    .btn-vr {
      background: linear-gradient(135deg, #00e5ff 0%, #0077ff 100%);
      color: #000;
      box-shadow: 0 0 20px var(--primary-glow);
    }

    .btn-vr:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(0, 229, 255, 0.8);
      background: linear-gradient(135deg, #33ebff 0%, #3392ff 100%);
    }

    .btn-glass {
      background: var(--bg-glass);
      border: 1px solid var(--border-glass);
      color: var(--text-main);
      backdrop-filter: blur(8px);
    }

    .btn-glass:hover {
      background: rgba(0, 229, 255, 0.15);
      border-color: var(--primary);
      color: #fff;
    }

    /* Custom Crosshair on Desktop */
    #desktop-reticle {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 8px;
      height: 8px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background-color: rgba(255, 255, 255, 0.4);
      border: 1px solid rgba(0, 229, 255, 0.6);
      pointer-events: none;
      z-index: 999;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }

    /* Hide 2D UI when in VR */
    .a-in-vr #ui-overlay,
    .a-in-vr #desktop-reticle {
      display: none !important;
    }

    @media (max-width: 768px) {
      #ui-overlay { padding: 16px; }
      .controls-guide { display: none; }
      .brand-text h1 { font-size: 16px; }
      .btn { padding: 10px 18px; font-size: 12px; }
    }
  </style>

  <script>
    // ==========================================
    // PROCEDURAL TEXTURE GENERATION (Fast & Lightweight)
    // ==========================================
    (function generateProceduralAssets() {
      // 1. Starfield Canvas (Sky)
      const starCanvas = document.createElement('canvas');
      starCanvas.id = 'starCanvas';
      starCanvas.width = 2048;
      starCanvas.height = 1024;
      const sCtx = starCanvas.getContext('2d');
      
      // Deep space black-blue gradient
      const skyGrad = sCtx.createLinearGradient(0, 0, 0, 1024);
      skyGrad.addColorStop(0, '#02040a');
      skyGrad.addColorStop(0.5, '#050a14');
      skyGrad.addColorStop(1, '#02040a');
      sCtx.fillStyle = skyGrad;
      sCtx.fillRect(0, 0, 2048, 1024);

      // Faint subtle cosmic dust / nebulae
      for (let n = 0; n < 3; n++) {
        const nx = 300 + n * 600;
        const ny = 300 + (n % 2) * 300;
        const nGrad = sCtx.createRadialGradient(nx, ny, 20, nx, ny, 400);
        nGrad.addColorStop(0, n === 0 ? 'rgba(0, 150, 255, 0.08)' : (n === 1 ? 'rgba(180, 50, 255, 0.06)' : 'rgba(0, 255, 180, 0.05)'));
        nGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        sCtx.fillStyle = nGrad;
        sCtx.fillRect(0, 0, 2048, 1024);
      }

      // Generate ~450 crisp stars
      for (let i = 0; i < 450; i++) {
        const x = Math.random() * 2048;
        const y = Math.random() * 1024;
        const radius = Math.random() * 1.5 + 0.3;
        const brightness = Math.random() * 0.7 + 0.3;
        
        // Star colors: crisp white, soft blue, warm gold
        const randColor = Math.random();
        let starColor = `rgba(255, 255, 255, ${brightness})`;
        if (randColor > 0.8) starColor = `rgba(180, 225, 255, ${brightness})`;
        else if (randColor > 0.65) starColor = `rgba(255, 235, 180, ${brightness})`;

        sCtx.beginPath();
        sCtx.arc(x, y, radius, 0, Math.PI * 2);
        sCtx.fillStyle = starColor;
        sCtx.fill();

        // Extra twinkle for larger stars
        if (radius > 1.3) {
          sCtx.beginPath();
          sCtx.arc(x, y, radius * 2.5, 0, Math.PI * 2);
          sCtx.fillStyle = `rgba(255, 255, 255, ${brightness * 0.25})`;
          sCtx.fill();
        }
      }

      // 2. Earth Procedural Texture Canvas
      const earthCanvas = document.createElement('canvas');
      earthCanvas.id = 'earthCanvas';
      earthCanvas.width = 1024;
      earthCanvas.height = 512;
      const eCtx = earthCanvas.getContext('2d');

      // Ocean base
      const oceanGrad = eCtx.createLinearGradient(0, 0, 0, 512);
      oceanGrad.addColorStop(0, '#0c2e60');
      oceanGrad.addColorStop(0.5, '#0b3c75');
      oceanGrad.addColorStop(1, '#0c2e60');
      eCtx.fillStyle = oceanGrad;
      eCtx.fillRect(0, 0, 1024, 512);

      // Stylized continents (Americas, Africa, Europe, Asia, Australia, Antarctica)
      eCtx.fillStyle = '#2d6a4f'; // Green-brown landmass

      // Americas
      eCtx.beginPath();
      eCtx.ellipse(280, 180, 80, 60, -0.2, 0, Math.PI * 2); // North America
      eCtx.ellipse(330, 320, 60, 90, 0.2, 0, Math.PI * 2);  // South America
      eCtx.fill();

      // Eurasia & Africa
      eCtx.fillStyle = '#386641';
      eCtx.beginPath();
      eCtx.ellipse(560, 290, 70, 90, 0, 0, Math.PI * 2);   // Africa
      eCtx.ellipse(600, 170, 130, 65, 0, 0, Math.PI * 2);  // Europe / Asia
      eCtx.ellipse(760, 200, 110, 60, 0.1, 0, Math.PI * 2); // East Asia
      eCtx.fill();

      // Australia
      eCtx.fillStyle = '#7f5539';
      eCtx.beginPath();
      eCtx.ellipse(820, 360, 55, 40, -0.1, 0, Math.PI * 2);
      eCtx.fill();

      // Polar Ice Caps
      eCtx.fillStyle = '#eaf4f4';
      eCtx.fillRect(0, 0, 1024, 35);
      eCtx.fillRect(0, 480, 1024, 32);

      // 3. Earth Clouds Canvas
      const cloudCanvas = document.createElement('canvas');
      cloudCanvas.id = 'cloudCanvas';
      cloudCanvas.width = 1024;
      cloudCanvas.height = 512;
      const cCtx = cloudCanvas.getContext('2d');
      cCtx.fillStyle = 'rgba(0,0,0,0)';
      cCtx.fillRect(0, 0, 1024, 512);

      cCtx.fillStyle = 'rgba(255, 255, 255, 0.45)';
      for (let i = 0; i < 40; i++) {
        const cx = Math.random() * 1024;
        const cy = 60 + Math.random() * 390;
        const cw = 60 + Math.random() * 140;
        const ch = 15 + Math.random() * 35;
        cCtx.beginPath();
        cCtx.ellipse(cx, cy, cw, ch, Math.random() * 0.4 - 0.2, 0, Math.PI * 2);
        cCtx.fill();
      }

      // 4. Moon Canvas
      const moonCanvas = document.createElement('canvas');
      moonCanvas.id = 'moonCanvas';
      moonCanvas.width = 512;
      moonCanvas.height = 256;
      const mCtx = moonCanvas.getContext('2d');
      mCtx.fillStyle = '#9e9e9e';
      mCtx.fillRect(0, 0, 512, 256);

      // Craters
      mCtx.fillStyle = '#757575';
      for (let i = 0; i < 30; i++) {
        const mx = Math.random() * 512;
        const my = Math.random() * 256;
        const mr = 4 + Math.random() * 18;
        mCtx.beginPath();
        mCtx.arc(mx, my, mr, 0, Math.PI * 2);
        mCtx.fill();
      }

      // Append canvases to document body head when ready
      document.addEventListener('DOMContentLoaded', () => {
        const assets = document.querySelector('a-assets');
        if (assets) {
          assets.appendChild(starCanvas);
          assets.appendChild(earthCanvas);
          assets.appendChild(cloudCanvas);
          assets.appendChild(moonCanvas);
        }
      });
    })();

    // ==========================================
    // PROCEDURAL AUDIO SYNTHESIZER (No External Files)
    // ==========================================
    const SoundFX = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },
      playBeep(freq = 880, dur = 0.08) {
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(freq * 1.5, this.ctx.currentTime + dur);
          gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + dur);
        } catch (e) {}
      },
      playDoorSound() {
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          // Servo tone
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(140, now);
          osc.frequency.linearRampToValueAtTime(80, now + 0.6);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.linearRampToValueAtTime(0.001, now + 0.6);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(now + 0.6);
        } catch (e) {}
      }
    };

    // ==========================================
    // CUSTOM A-FRAME COMPONENTS
    // ==========================================
    
    // 1. Smooth Thumbstick Movement for Quest 3 Controllers
    AFRAME.registerComponent('thumbstick-movement', {
      schema: { speed: { default: 0.08 } },
      init: function () {
        this.moveX = 0;
        this.moveZ = 0;
        this.el.addEventListener('axismove', (evt) => {
          // Axis 2 & 3 for Quest thumbsticks
          if (evt.detail.axis.length >= 4) {
            this.moveX = evt.detail.axis[2];
            this.moveZ = evt.detail.axis[3];
          } else if (evt.detail.axis.length >= 2) {
            this.moveX = evt.detail.axis[0];
            this.moveZ = evt.detail.axis[1];
          }
        });
      },
      tick: function () {
        if (Math.abs(this.moveX) > 0.1 || Math.abs(this.moveZ) > 0.1) {
          const rig = document.getElementById('rig');
          const camera = document.getElementById('camera');
          if (!rig || !camera) return;
          
          const rot = camera.getAttribute('rotation');
          const angle = (rot.y * Math.PI) / 180;
          
          const dx = (this.moveX * Math.cos(angle) + this.moveZ * Math.sin(angle)) * this.data.speed;
          const dz = (-this.moveX * Math.sin(angle) + this.moveZ * Math.cos(angle)) * this.data.speed;
          
          const pos = rig.getAttribute('position');
          rig.setAttribute('position', {
            x: pos.x + dx,
            y: pos.y,
            z: pos.z + dz
          });
        }
      }
    });

    // 2. Station Bounds Clamp (Keep player inside space station walls)
    AFRAME.registerComponent('station-bounds', {
      tick: function () {
        const pos = this.el.getAttribute('position');
        if (!pos) return;
        
        let clamped = false;
        let newX = pos.x;
        let newZ = pos.z;

        // Bounding limits of space station rooms
        const minX = -6.2, maxX = 6.2;
        const minZ = -3.8, maxZ = 5.8;

        if (newX < minX) { newX = minX; clamped = true; }
        if (newX > maxX) { newX = maxX; clamped = true; }
        if (newZ < minZ) { newZ = minZ; clamped = true; }
        if (newZ > maxZ) { newZ = maxZ; clamped = true; }

        if (clamped) {
          this.el.setAttribute('position', { x: newX, y: pos.y, z: newZ });
        }
      }
    });

    // 3. Interactive Planet Clicker Component
    AFRAME.registerComponent('planet-info', {
      schema: {
        name: { type: 'string', default: 'Planet' },
        info: { type: 'string', default: 'Details' }
      },
      init: function () {
        this.el.addEventListener('click', () => {
          SoundFX.playBeep(1100);
          updateInfoDisplay(this.data.name, this.data.info);
        });
      }
    });
  </script>
</head>
<body>

  <!-- 2D Screen Overlay UI -->
  <div id="ui-overlay">
    <!-- Top Header -->
    <header class="top-bar">
      <div class="brand">
        <div class="brand-logo">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" fill="none"/>
            <path d="M3 12h18M12 3c3 3 5 6 5 9s-2 6-5 9c-3-3-5-6-5-9s2-6 5-9z" stroke="currentColor" stroke-width="1.5" fill="none"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>Orbital Horizon</h1>
          <p>Orbital Station Alpha // Low Earth Orbit</p>
        </div>
      </div>
      <div class="status-badge">
        <div class="status-dot"></div>
        <span>STATION STATUS: ONLINE</span>
      </div>
    </header>

    <!-- Interactive Info Readout (Desktop & VR Sync) -->
    <div id="info-toast" class="info-toast">
      <h3 id="toast-title">Observation Deck</h3>
      <p id="toast-desc">Look through the panoramic window to view Earth in real-time orbit. Walk freely between station modules.</p>
    </div>

    <!-- Bottom Action & Controls Bar -->
    <footer class="bottom-bar">
      <div class="controls-guide">
        <span class="controls-title">Desktop Navigation</span>
        <div class="keys-row">
          <div class="key-group">
            <span class="key-badge">W</span>
            <span class="key-badge">A</span>
            <span class="key-badge">S</span>
            <span class="key-badge">D</span>
            <span>Move</span>
          </div>
          <div class="key-group">
            <span class="key-badge">Mouse</span>
            <span>Look</span>
          </div>
          <div class="key-group">
            <span class="key-badge">Click / E</span>
            <span>Interact</span>
          </div>
        </div>
      </div>

      <div class="action-panel">
        <button id="btn-toggle-lights" class="btn btn-glass" onclick="toggleInteriorLights()">
          💡 Lights
        </button>
        <button id="btn-toggle-airlock" class="btn btn-glass" onclick="toggleAirlockDoor()">
          🚪 Airlock
        </button>
        <button id="btn-enter-vr" class="btn btn-vr" onclick="enterVRMode()">
          🥽 ENTER VR
        </button>
      </div>
    </footer>
  </div>

  <!-- Center Desktop Crosshair / Reticle -->
  <div id="desktop-reticle"></div>

  <!-- A-FRAME 3D SCENE -->
  <a-scene
    renderer="antialias: true; colorManagement: true; powerPreference: high; precision: medium;"
    vr-mode-ui="enabled: false"
    loading-screen="dotsColor: #00e5ff; backgroundColor: #02040a"
  >
    <!-- Asset Management -->
    <a-assets timeout="4000">
      <!-- Canvases are injected dynamically in <script> -->
      <a-mixin id="button-base"
        geometry="primitive: box; depth: 0.05; height: 0.22; width: 0.55"
        material="color: #1e293b; roughness: 0.3; metalness: 0.6;"
        animation__mouseenter="property: scale; to: 1.05 1.05 1.05; dur: 150"
        animation__mouseleave="property: scale; to: 1 1 1; dur: 150">
      </a-mixin>
      <a-mixin id="screen-glow"
        material="color: #0b192c; emissive: #00e5ff; emissiveIntensity: 0.25; roughness: 0.2;">
      </a-mixin>
    </a-assets>

    <!-- ==========================================
         LIGHTING (Optimized minimal count)
         ========================================== -->
    <!-- Ambient Interior Glow -->
    <a-light id="ambientLight" type="ambient" color="#b0cddb" intensity="0.55"></a-light>
    
    <!-- Exterior Sunlight (Directional) -->
    <a-light id="sunLight" type="directional" color="#fff8e7" intensity="1.25" position="-40 30 -60"></a-light>

    <!-- Soft Interior Point Lights -->
    <a-light id="stationLight1" type="point" color="#cceeff" intensity="0.65" distance="12" position="0 2.8 0"></a-light>
    <a-light id="stationLight2" type="point" color="#00e5ff" intensity="0.4" distance="8" position="4 2.5 1"></a-light>
    <a-light id="stationLight3" type="point" color="#00ff88" intensity="0.35" distance="8" position="-4 2.5 1"></a-light>

    <!-- ==========================================
         PLAYER RIG & VR CONTROLLERS
         ========================================== -->
    <a-entity id="rig" position="0 0 1" station-bounds>
      <!-- Camera (Spawns facing 0 0 -1 towards panoramic Earth window) -->
      <a-camera id="camera" position="0 1.6 0" look-controls="pointerLockEnabled: false" wasd-controls="acceleration: 22">
        <!-- Desktop reticle raycaster for clicking -->
        <a-cursor
          id="cursor"
          raycaster="objects: .clickable; far: 8"
          fuse="false"
          material="color: #00e5ff; shader: flat; opacity: 0.7"
          geometry="primitive: ring; radiusInner: 0.005; radiusOuter: 0.009"
          position="0 0 -0.8"
          animation__click="property: scale; startEvents: click; easing: easeInCubic; dur: 120; from: 0.1 0.1 0.1; to: 1 1 1">
        </a-cursor>
      </a-camera>

      <!-- Meta Quest 3 Controllers -->
      <!-- Left Hand -->
      <a-entity id="leftController"

    // State Variables
    let lightsOn = true;
    let airlockOpen = false;
    let isAirlockAnimating = false;

    // DOM Elements
    const toastTitle = document.getElementById('toast-title');
    const toastDesc = document.getElementById('toast-desc');
    const vrTitle = document.getElementById('vr-info-title');
    const vrLine1 = document.getElementById('vr-info-line1');
    const vrLine2 = document.getElementById('vr-info-line2');
    const vrLine3 = document.getElementById('vr-info-line3');
    
    // 1. Enter VR Function
    function enterVRMode() {
      SoundFX.playBeep(950);
      const scene = document.querySelector('a-scene');
      if (scene) {
        if (scene.hasLoaded) {
          scene.enterVR();
        } else {
          scene.addEventListener('loaded', () => scene.enterVR());
        }
      }
    }

    // 2. Info Card Update Function (Syncs 2D overlay & 3D floating panel)
    function updateInfoDisplay(title, description) {
      if (toastTitle && toastDesc) {
        toastTitle.innerText = title;
        toastDesc.innerText = description;
      }
      if (vrTitle && vrLine1) {
        vrTitle.setAttribute('value', title);
        vrLine1.setAttribute('value', description.substring(0, 42));
        vrLine2.setAttribute('value', description.substring(42, 84) || '---');
        vrLine3.setAttribute('value', description.substring(84, 126) || '---');
      }
    }

    // 3. Toggle Interior Station Lights
    function toggleInteriorLights() {
      SoundFX.playBeep(lightsOn ? 440 : 880);
      lightsOn = !lightsOn;

      const amb = document.getElementById('ambientLight');
      const l1 = document.getElementById('stationLight1');
      const l2 = document.getElementById('stationLight2');
      const l3 = document.getElementById('stationLight3');
      const lightBtnMesh = document.getElementById('light-btn-mesh');
      const uiLightBtn = document.getElementById('btn-toggle-lights');

      if (lightsOn) {
        // Bright Normal Mode
        if (amb) amb.setAttribute('intensity', '0.55');
        if (l1) l1.setAttribute('intensity', '0.65');
        if (l2) l2.setAttribute('intensity', '0.4');
        if (l3) l3.setAttribute('intensity', '0.35');
        if (lightBtnMesh) lightBtnMesh.setAttribute('material', 'color: #0284c7; emissive: #38bdf8; emissiveIntensity: 0.4');
        if (uiLightBtn) uiLightBtn.innerText = '💡 Lights [ON]';
        updateInfoDisplay('STATION LIGHTING', 'Main interior luminescence set to DAYLIGHT NOMINAL (100%).');
      } else {
        // Night / Emergency Mode (Low blue-red ambient)
        if (amb) amb.setAttribute('intensity', '0.12');
        if (l1) l1.setAttribute('intensity', '0.08');
        if (l2) l2.setAttribute('intensity', '0.15');
        if (l3) l3.setAttribute('intensity', '0.1');
        if (lightBtnMesh) lightBtnMesh.setAttribute('material', 'color: #dc2626; emissive: #ef4444; emissiveIntensity: 0.6');
        if (uiLightBtn) uiLightBtn.innerText = '💡 Lights [NIGHT]';
        updateInfoDisplay('STATION LIGHTING', 'Switched to LOW-POWER ORBITAL NIGHT MODE (15%).');
      }
    }

    // 4. Toggle Airlock Door (Smooth sliding animation)
    function toggleAirlockDoor() {
      if (isAirlockAnimating) return;
      isAirlockAnimating = true;

      SoundFX.playDoorSound();
      airlockOpen = !airlockOpen;

      const doorLeft = document.getElementById('doorLeft');
      const doorRight = document.getElementById('doorRight');
      const beacon = document.getElementById('airlock-beacon');
      const btnLight = document.getElementById('airlock-button-light');
      const uiAirlockBtn = document.getElementById('btn-toggle-airlock');

      const targetLeftX = airlockOpen ? -1.35 : -0.5;
      const targetRightX = airlockOpen ? 1.35 : 0.5;
      const beaconColor = airlockOpen ? '#eab308' : '#22c55e';

      if (beacon) beacon.setAttribute('material', `color: ${beaconColor}; emissive: ${beaconColor}; emissiveIntensity: 1; shader: flat;`);
      if (btnLight) btnLight.setAttribute('material', `color: ${beaconColor}; emissive: ${beaconColor}; emissiveIntensity: 1; shader: flat;`);

      // Animate door panels
      if (doorLeft && doorRight) {
        doorLeft.setAttribute('animation', `property: position; to: ${targetLeftX} 1.3 0; dur: 800; easing: easeInOutQuad`);
        doorRight.setAttribute('animation', `property: position; to: ${targetRightX} 1.3 0; dur: 800; easing: easeInOutQuad`);
      }

      setTimeout(() => {
        isAirlockAnimating = false;
        if (uiAirlockBtn) uiAirlockBtn.innerText = airlockOpen ? '🚪 Airlock [OPEN]' : '🚪 Airlock [CLOSED]';
      }, 820);

      if (airlockOpen) {
        updateInfoDisplay('AIRLOCK STATUS', 'WARNING: Airlock Chamber Open. Outer vacuum barrier active.');
      } else {
        updateInfoDisplay('AIRLOCK STATUS', 'Airlock Chamber Sealed. Cabin atmosphere fully pressurized (101.3 kPa).');
      }
    }

    // 5. Earth Info Button Handler
    function triggerEarthInfo() {
      SoundFX.playBeep(1000);
      updateInfoDisplay(
        'PLANET EARTH',
        'Type: Terrestrial Planet | Diameter: 12,742 km | Distance from Sun: 149.6M km | Atmosphere: 78% N2, 21% O2'
      );
    }

    // 6. Solar System Info Button Handler
    function triggerSolarInfo() {
      SoundFX.playBeep(900);
      updateInfoDisplay(
        'SOLAR SYSTEM ORRERY',
        '8 Major Planets in compressed orbital scale. Point and click any planetary sphere for scientific details.'
      );
    }

    // Initialize Keyboard Shortuts (E to interact with look target)
    window.addEventListener('keydown', (e) => {
      if (e.key === 'e' || e.key === 'E') {
        const cursor = document.getElementById('cursor');
        if (cursor && cursor.components && cursor.components.raycaster) {
          const intersected = cursor.components.raycaster.intersectedEls;
          if (intersected && intersected.length > 0) {
            intersected[0].emit('click');
          }
        }
      }
    });

    // Handle user gestures to unlock Web Audio API
    window.addEventListener('click', () => SoundFX.init(), { once: true });
    window.addEventListener('touchstart', () => SoundFX.init(), { once: true });
  </script>
</body>
</html>
